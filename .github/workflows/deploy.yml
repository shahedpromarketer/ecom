name: Deploy to crm.netpilotdigital.com

# Every push to main builds the assets and ships the code to the preview server.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SSH_HOST: 93.127.194.245
  SSH_USER: ecom-pilot-deploy
  APP_DIR: /home/netpilotdigital-crm/htdocs/crm.netpilotdigital.com

jobs:
  # All automatic tests must pass before anything reaches the live server.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, intl, bcmath, zip, gd
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci --no-audit --no-fund
          npm run build
          cp .env.example .env
          php artisan key:generate

      - name: Run the tests
        run: php artisan test

  deploy:
    needs: test   # only when every test passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build front-end assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # The server sometimes answers slowly; retry instead of failing the deploy.
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            echo "ssh-keyscan attempt $i failed, retrying…"; sleep 10
          done
          [ -s ~/.ssh/known_hosts ] || { echo "Could not reach $SSH_HOST"; exit 1; }

      - name: Upload code
        # Server-only files (.env, storage, vendor, uploaded files, SSL challenge) are never touched.
        run: |
          rsync -rlz --delete --omit-dir-times --no-perms --chmod=Dug+rwx,Fug+rw \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='/.env' --exclude='/vendor/' --exclude='/storage/' \
            --exclude='/bootstrap/cache/' --exclude='/public/storage' \
            --exclude='public/.well-known/' --exclude='desktop.ini' \
            ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

      - name: Install, migrate, refresh caches
        run: |
          ssh "$SSH_USER@$SSH_HOST" bash -se <<EOF
            set -e
            umask 002
            cd "$APP_DIR"
            composer install --no-dev --optimize-autoloader --no-interaction --no-progress
            php8.4 artisan migrate --force
            php8.4 artisan optimize:clear
            php8.4 artisan config:cache
            php8.4 artisan route:cache
            php8.4 artisan event:cache
            php8.4 artisan view:cache
            php8.4 artisan queue:restart || true
            # Only files this user owns; files the web server created can't be chmod-ed by us.
            # Folders the web server made (e.g. recharge screenshots) aren't readable here: don't fail on them.
            find storage bootstrap/cache -user "\$(whoami)" -exec chmod g+rwX {} + 2>/dev/null || true
          EOF

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://crm.netpilotdigital.com/admin/login)
          echo "Login page returned $code"
          test "$code" = "200"
